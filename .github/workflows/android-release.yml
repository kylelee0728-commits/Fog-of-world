name: Android Release

# 兩種發佈方式：
#   1. 手動觸發並填版本號（例如 26.8.1）—— 會自動更新 build.gradle.kts 再發佈
#   2. 推送 v* 標籤 —— 版本號必須與 build.gradle.kts 一致，否則直接失敗
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本號：年份尾數.月份[.小版本]，例如 26.8、26.8.1、26.9'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 決定並檢查版本號
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          GRADLE_FILE=android/app/build.gradle.kts
          FILE_VERSION=$(grep -oP '^val appVersionName = "\K[^"]+' "$GRADLE_FILE")

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # 年份尾數.月份[.小版本]，月份 1-12，小版本 0-99
          if ! echo "$VERSION" | grep -qE '^[0-9]{2}\.(1[0-2]|[1-9])(\.[0-9]{1,2})?$'; then
            echo "::error::版本號格式錯誤：$VERSION（應為 26.8、26.8.1、26.9 這種形式）"
            exit 1
          fi

          echo "版本號：$VERSION（檔案目前是 $FILE_VERSION）"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$VERSION" != "$FILE_VERSION" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::標籤 $GITHUB_REF_NAME 與 build.gradle.kts 的 $FILE_VERSION 不一致"
            exit 1
          fi

      - name: 更新版本號並提交
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.name != steps.version.outputs.file
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          GRADLE_FILE=android/app/build.gradle.kts
          sed -i -E "s|^val appVersionName = \".*\"$|val appVersionName = \"$VERSION\"|" "$GRADLE_FILE"
          grep -q "^val appVersionName = \"$VERSION\"$" "$GRADLE_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$GRADLE_FILE"
          git commit -m "版本號更新為 $VERSION"
          git push origin HEAD:${{ github.ref_name }}

      - name: 準備簽章金鑰（有設定 secret 才會用）
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=正式金鑰" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "signed=debug 金鑰" >> "$GITHUB_OUTPUT"
          fi

      - name: 建置 Release APK
        working-directory: android
        env:
          FOW_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          FOW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FOW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FOW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 確認產物是可安裝的 APK
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "找不到 APK"; exit 1; }
          unzip -l "$APK" | grep -q AndroidManifest.xml || { echo "APK 內容不完整"; exit 1; }
          grep -qa "APK Sig Block 42" "$APK" || { echo "APK 沒有簽章，無法安裝"; exit 1; }
          cp "$APK" "fog-of-world-$VERSION.apk"
          ls -lh "fog-of-world-$VERSION.apk"

      - name: 發佈 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          SIGNED_WITH: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES=$(cat <<EOF
          ## 拾光者 $VERSION（Android）

          世界的光開始遺失，只有親自走過的地方光會回來。

          **安裝方式**：手機直接點下面的 \`fog-of-world-$VERSION.apk\` 下載開啟，
          第一次會要求允許「安裝未知來源的應用程式」。

          ### 內容
          - 走路點亮世界，走過的地方永久保留
          - **螢幕關掉、切到背景也會持續記錄**（前景服務）
          - 32 個成就、8 個稱號、123 個世界地標護照
          - 沒有後端也沒有帳號，所有位置資料只留在手機裡
          - 定位使用系統服務，不需要 Google Play 服務

          ### 權限
          走路時請把定位設成「一律允許」，才能在鎖屏後繼續記錄；
          只給「使用應用程式時允許」也能玩，但畫面關掉就會停。

          ### 更新
          App 內建自動更新，之後的版本會在開啟時提示，不必再回到這裡下載。

          ---
          本 APK 以 $SIGNED_WITH 簽章。若更新時出現「應用程式未安裝」，請先移除舊版再安裝。
          EOF
          )
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "fog-of-world-$VERSION.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "拾光者 $VERSION" \
            --notes "$NOTES"
          gh release view "$TAG" --json tagName,assets \
            --jq '"已發佈 \(.tagName)：\(.assets[].name)（\(.assets[].size) bytes）"'

      - uses: actions/upload-artifact@v4
        with:
          name: fog-of-world-release-apk
          path: fog-of-world-*.apk
          if-no-files-found: error
