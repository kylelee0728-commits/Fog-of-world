name: Android Release

# 推送 v* 標籤時建置並發佈正式的 Release（例如 v26.8）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發佈的版本標籤（例如 v26.8）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 手動觸發時標籤可能還不存在，直接用目前的 ref 建置，
      # 標籤交給後面的 gh release create 一併建立。
      - uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 取出版本號
        id: version
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME"

      - name: 準備簽章金鑰（有設定 secret 才會用）
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=正式金鑰" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "signed=debug 金鑰" >> "$GITHUB_OUTPUT"
          fi

      - name: 建置 Release APK
        working-directory: android
        env:
          FOW_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          FOW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FOW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FOW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 確認產物是可安裝的 APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "找不到 APK"; exit 1; }
          unzip -l "$APK" | grep -q AndroidManifest.xml || { echo "APK 內容不完整"; exit 1; }
          grep -qa "APK Sig Block 42" "$APK" || { echo "APK 沒有簽章，無法安裝"; exit 1; }
          cp "$APK" "fog-of-world-${{ steps.version.outputs.name }}.apk"
          ls -lh fog-of-world-*.apk

      - name: 發佈 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
          SIGNED_WITH: ${{ steps.signing.outputs.signed }}
        run: |
          NOTES=$(cat <<EOF
          ## 世界迷霧 $VERSION（Android）

          戰後大霧籠罩世界，用雙腳走出去撥開迷霧。

          **安裝方式**：手機直接點下面的 \`fog-of-world-$VERSION.apk\` 下載開啟，
          第一次會要求允許「安裝未知來源的應用程式」。

          ### 這個版本有什麼
          - 走路撥霧，走過的地方永久保留
          - **螢幕關掉、切到背景也會持續記錄**（前景服務）
          - 32 個成就、8 個階級、123 個世界地標護照
          - 沒有後端也沒有帳號，所有位置資料只留在手機裡
          - 定位使用系統服務，不需要 Google Play 服務

          ### 權限
          走路時請把定位設成「一律允許」，才能在鎖屏後繼續記錄；
          只給「使用應用程式時允許」也能玩，但畫面關掉就會停。

          ---
          本 APK 以 $SIGNED_WITH 簽章。
          若之後更新時出現「應用程式未安裝」，請先移除舊版再安裝。
          EOF
          )
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" "fog-of-world-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "世界迷霧 $VERSION" \
            --notes "$NOTES"
          gh release view "$TAG" --json tagName,assets \
            --jq '"已發佈 \(.tagName)：\(.assets[].name) (\(.assets[].size) bytes)"'

      - uses: actions/upload-artifact@v4
        with:
          name: fog-of-world-release-apk
          path: fog-of-world-*.apk
          if-no-files-found: error
