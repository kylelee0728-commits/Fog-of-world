name: Android

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'src/landmarks.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 檢查地標資料與網頁版一致
        run: |
          node -e "
            const fs = require('fs');
            import('./src/landmarks.js').then(({ LANDMARKS }) => {
              const asset = JSON.parse(fs.readFileSync('android/app/src/main/assets/landmarks.json', 'utf8'));
              if (JSON.stringify(LANDMARKS) !== JSON.stringify(asset)) {
                console.error('landmarks.json 與 src/landmarks.js 不一致，請重新產生資產檔');
                process.exit(1);
              }
              console.log('地標資料一致：' + asset.length + ' 個');
            });
          "

      - name: 建置 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 上傳 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: fog-of-world-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 目前不自動發佈 Release，APK 只留在上面的 Actions 成品裡。
      # 要恢復自動發佈，用 android-release.yml 手動觸發即可。
