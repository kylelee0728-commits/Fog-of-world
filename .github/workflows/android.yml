name: Android

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'src/landmarks.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 檢查地標資料與網頁版一致
        run: |
          node -e "
            const fs = require('fs');
            import('./src/landmarks.js').then(({ LANDMARKS }) => {
              const asset = JSON.parse(fs.readFileSync('android/app/src/main/assets/landmarks.json', 'utf8'));
              if (JSON.stringify(LANDMARKS) !== JSON.stringify(asset)) {
                console.error('landmarks.json 與 src/landmarks.js 不一致，請重新產生資產檔');
                process.exit(1);
              }
              console.log('地標資料一致：' + asset.length + ' 個');
            });
          "

      - name: 建置 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 上傳 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: fog-of-world-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 手機上從 Actions 下載的是 zip，很難直接安裝；
      # 因此在 main 上另外發佈一個固定的 Release，APK 可以直接點下去安裝。
      - name: 發佈可直接安裝的 APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fog-of-world.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest fog-of-world.apk \
            --title "世界迷霧 Android（最新建置）" \
            --notes "由 commit ${GITHUB_SHA:0:7} 自動建置。手機直接點下面的 fog-of-world.apk 安裝即可（需允許「安裝未知來源的應用程式」）。" \
            --prerelease
